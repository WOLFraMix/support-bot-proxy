<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Support Bot</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
        }

        body {
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #f2f4f7;
            height: 100vh;
            display: flex;
            justify-content: center;
            padding: 24px;
        }

        .chat {
            width: 100%;
            max-width: 560px;
            display: flex;
            flex-direction: column;
        }

        h1 {
            font-size: 18px;
            color: #333;
            margin-bottom: 16px;
        }

        #log {
            flex: 1;
            overflow-y: auto;
            background: #fff;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .08);
        }

        .msg {
            margin-bottom: 12px;
            line-height: 1.45;
        }

        .msg.user {
            text-align: right;
        }

        .msg.user .bubble {
            background: #d3e3fd;
        }

        .bubble {
            display: inline-block;
            background: #eef1f5;
            border-radius: 12px;
            padding: 10px 14px;
            max-width: 80%;
            white-space: pre-wrap;
            text-align: left;
        }

        .meta {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }

        .msg.error .bubble {
            background: #fde8e8;
            color: #a33;
        }

        form {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #d5d9e0;
            border-radius: 10px;
            font-size: 14px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            background: #4a6cf7;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }

        button:disabled {
            background: #aab;
            cursor: default;
        }
    </style>
</head>

<body>
    <div class="chat">
        <h1>Support Bot — демо-чат</h1>
        <div id="log"></div>
        <form id="f">
            <input id="t" placeholder="Опишите проблему..." autocomplete="off" required>
            <button id="btn">Отправить</button>
        </form>
    </div>
    <script>
        const log = document.getElementById("log");

        function add(cls, text, meta) {
            const d = document.createElement("div");
            d.className = "msg " + cls;
            let html = '<div class="bubble"></div>';
            if (meta) html += '<div class="meta"></div>';
            d.innerHTML = html;
            d.querySelector(".bubble").textContent = text;
            if (meta) d.querySelector(".meta").textContent = meta;
            log.appendChild(d);
            log.scrollTop = log.scrollHeight;
        }

        document.getElementById("f").addEventListener("submit", async (e) => {
            e.preventDefault();
            const input = document.getElementById("t");
            const btn = document.getElementById("btn");
            const text = input.value.trim();
            if (!text) return;

            add("user", text);
            input.value = "";
            btn.disabled = true;
            add("bot", "…обрабатываю запрос");

            try {
                const r = await fetch("/api/v1/support", {
                    method: "POST",
                    headers: { "Content-Type": "application/json; charset=utf-8" },
                    body: JSON.stringify({ user_text: text })
                });
                if (!r.ok) throw new Error("Сервер вернул " + r.status);
                const d = await r.json();
                log.lastChild.remove(); // убираем "обрабатываю"
                add("bot", d.draft_reply,
                    "Тикет: " + d.ticket_key + " · категория: " + d.category);
            } catch (err) {
                log.lastChild.remove();
                add("error", "Ошибка: " + err.message);
            } finally {
                btn.disabled = false;
                log.scrollTop = log.scrollHeight;
            }
        });
    </script>
</body>

</html>
